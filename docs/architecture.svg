<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" font-family="Segoe UI, Noto Sans, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#37474f"/></marker>
    <marker id="g" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2e7d32"/></marker>
    <marker id="o" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#ef6c00"/></marker>
    <style>
      .t{font-size:13px;fill:#1f2a1f}.h{font-size:15px;font-weight:700;fill:#1b5e20}.s{font-size:11px;fill:#455a64}
      .box{fill:#fff;stroke:#2e7d32;stroke-width:1.6;rx:10}.eng{fill:#e8f5e9;stroke:#2e7d32;stroke-width:1.6;rx:10}
      .data{fill:#e3f2fd;stroke:#1565c0;stroke-width:1.4;rx:8}.store{fill:#fff8e1;stroke:#f9a825;stroke-width:1.4;rx:8}
      .usr{fill:#f1f8e9;stroke:#558b2f;stroke-width:1.6;rx:10}.ext{fill:#fce4ec;stroke:#c2185b;stroke-width:1.4;rx:8}
      .l{stroke:#37474f;stroke-width:1.5;fill:none;marker-end:url(#a)}.m{stroke:#ef6c00;stroke-width:2;fill:none;marker-end:url(#o);stroke-dasharray:6 4}
      .e{stroke:#2e7d32;stroke-width:2;fill:none;marker-end:url(#g)}
    </style>
  </defs>
  <rect width="1240" height="800" fill="#fbfdfb"/>
  <text x="620" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1b5e20">Krishi Sahay: plan the crop to the water, schedule the water and power, sell what you grow</text>

  <!-- USERS -->
  <text x="20" y="62" class="h">1  People</text>
  <rect class="usr" x="20" y="72" width="190" height="86"/><text x="115" y="96" text-anchor="middle" class="h">Farmer</text><text x="115" y="115" text-anchor="middle" class="s">phone, Hindi / Marathi / +18 more</text><text x="115" y="131" text-anchor="middle" class="s">voice or text, low literacy</text><text x="115" y="147" text-anchor="middle" class="s">phone + PIN</text>
  <rect class="usr" x="20" y="176" width="190" height="70"/><text x="115" y="200" text-anchor="middle" class="h">Vendor / buyer</text><text x="115" y="219" text-anchor="middle" class="s">posts priced needs within 50 km</text><text x="115" y="235" text-anchor="middle" class="s">sees supply coming</text>
  <rect class="usr" x="20" y="264" width="190" height="70"/><text x="115" y="288" text-anchor="middle" class="h">FPO / gram panchayat</text><text x="115" y="307" text-anchor="middle" class="s">village water roll-up</text><text x="115" y="323" text-anchor="middle" class="s">Water Security Plan input</text>

  <!-- APP -->
  <text x="260" y="62" class="h">2  Screens (Streamlit, mobile first)</text>
  <rect class="box" x="260" y="72" width="200" height="40"/><text x="360" y="97" text-anchor="middle" class="t">Farm Plan: farm, crops, plan</text>
  <rect class="box" x="260" y="120" width="200" height="40"/><text x="360" y="145" text-anchor="middle" class="t">Ask: voice chat, saved history</text>
  <rect class="box" x="260" y="168" width="200" height="40"/><text x="360" y="193" text-anchor="middle" class="t">Buyers and priced offers</text>
  <rect class="box" x="260" y="216" width="200" height="40"/><text x="360" y="241" text-anchor="middle" class="t">Village water and power</text>
  <rect class="box" x="260" y="264" width="200" height="40"/><text x="360" y="289" text-anchor="middle" class="t">Irrigate today? and pump sizing</text>
  <rect class="box" x="260" y="312" width="200" height="40"/><text x="360" y="337" text-anchor="middle" class="t">Group chat, market prices, tips</text>
  <path class="l" d="M210 115 L258 100"/><path class="l" d="M210 125 L258 140"/><path class="l" d="M210 210 L258 190"/><path class="l" d="M210 300 L258 238"/>

  <!-- ENGINES -->
  <text x="520" y="62" class="h">3  Decision engines (krishi/)</text>
  <rect class="eng" x="520" y="72" width="250" height="78"/><text x="645" y="94" text-anchor="middle" class="h">Climate risk and water balance</text><text x="645" y="112" text-anchor="middle" class="s">FAO-56 daily soil water, 30 past seasons</text><text x="645" y="127" text-anchor="middle" class="s">drought, heavy rain, trend, irrigation schedule</text><text x="645" y="142" text-anchor="middle" class="s">pump energy and CO2</text>
  <rect class="eng" x="520" y="160" width="250" height="78"/><text x="645" y="182" text-anchor="middle" class="h">Profit and risk recommender</text><text x="645" y="200" text-anchor="middle" class="s">yield x price x (1-loss) - cost; bad year</text><text x="645" y="215" text-anchor="middle" class="s">glut caps, MSP floor, rough-number safeguards</text><text x="645" y="230" text-anchor="middle" class="s">acre allocation per plot</text>
  <rect class="eng" x="520" y="248" width="250" height="64"/><text x="645" y="270" text-anchor="middle" class="h">Pump sizing and payback</text><text x="645" y="288" text-anchor="middle" class="s">HP, solar kWp, KUSUM subsidy split</text><text x="645" y="303" text-anchor="middle" class="s">farmer's own prices as inputs</text>
  <rect class="eng" x="520" y="322" width="250" height="64"/><text x="645" y="344" text-anchor="middle" class="h">Voice assistant</text><text x="645" y="362" text-anchor="middle" class="s">speech to text, LLM with farm context</text><text x="645" y="377" text-anchor="middle" class="s">translate, text to speech</text>
  <rect class="eng" x="520" y="396" width="250" height="52"/><text x="645" y="418" text-anchor="middle" class="h">Planting registry and matching</text><text x="645" y="436" text-anchor="middle" class="s">nearby plans, 50 km Haversine, offers</text>
  <path class="l" d="M460 92 L518 110"/><path class="l" d="M460 140 L518 350"/><path class="l" d="M460 188 L518 200"/><path class="l" d="M460 236 L518 420"/><path class="l" d="M460 284 L518 280"/>
  <path class="l" d="M645 150 L645 158"/>

  <!-- DATA SOURCES -->
  <text x="830" y="62" class="h">4  Verified data sources</text>
  <rect class="data" x="830" y="72" width="230" height="56"/><text x="945" y="94" text-anchor="middle" class="t">ERA5 + forecast (Open-Meteo)</text><text x="945" y="112" text-anchor="middle" class="s">rain, ET0, 30 years, 7-day outlook</text>
  <rect class="data" x="830" y="136" width="230" height="56"/><text x="945" y="158" text-anchor="middle" class="t">Agmarknet via CEDA open API</text><text x="945" y="176" text-anchor="middle" class="s">monthly mandi prices and arrivals</text>
  <rect class="data" x="830" y="200" width="230" height="56"/><text x="945" y="222" text-anchor="middle" class="t">FAO-56 / FAO-33 tables</text><text x="945" y="240" text-anchor="middle" class="s">Kc, root depth, Ky</text>
  <rect class="data" x="830" y="264" width="230" height="56"/><text x="945" y="286" text-anchor="middle" class="t">Cited crop table</text><text x="945" y="304" text-anchor="middle" class="s">CACP, NHB, NABCONS, MSP (PIB)</text>
  <rect class="data" x="830" y="328" width="230" height="56"/><text x="945" y="350" text-anchor="middle" class="t">Soil and place</text><text x="945" y="368" text-anchor="middle" class="s">SoilGrids pH, geocoding</text>
  <rect class="ext" x="830" y="392" width="230" height="56"/><text x="945" y="414" text-anchor="middle" class="t">Together AI + Google Translate/gTTS</text><text x="945" y="432" text-anchor="middle" class="s">LLM, speech; Bhashini optional (22 langs)</text>
  <path class="l" d="M770 100 L828 100"/><path class="l" d="M770 190 L828 164"/><path class="l" d="M770 120 L828 228"/><path class="l" d="M770 215 L828 290"/><path class="l" d="M770 350 L828 420"/><path class="l" d="M770 130 L828 356"/>

  <!-- STORAGE -->
  <text x="1110" y="62" class="h">5  Storage</text>
  <rect class="store" x="1110" y="72" width="120" height="376"/>
  <text x="1170" y="100" text-anchor="middle" class="t">JSON now</text><text x="1170" y="118" text-anchor="middle" class="s">farmers</text><text x="1170" y="134" text-anchor="middle" class="s">vendors</text><text x="1170" y="150" text-anchor="middle" class="s">plans</text><text x="1170" y="166" text-anchor="middle" class="s">polls / offers</text><text x="1170" y="182" text-anchor="middle" class="s">chats (text)</text><text x="1170" y="198" text-anchor="middle" class="s">communities</text>
  <text x="1170" y="236" text-anchor="middle" class="t">Next</text><text x="1170" y="254" text-anchor="middle" class="s">managed DB</text><text x="1170" y="270" text-anchor="middle" class="s">per-farm sensor</text><text x="1170" y="286" text-anchor="middle" class="s">readings</text><text x="1170" y="302" text-anchor="middle" class="s">(optional)</text>
  <path class="l" d="M645 448 L645 470 L1170 470 L1170 450"/>

  <!-- FLOWS ROW -->
  <text x="20" y="490" class="h">Water, energy and money flows</text>
  <rect class="box" x="20" y="505" width="1200" height="270"/>

  <text x="40" y="530" class="h">Water and energy (what the app optimises)</text>
  <rect class="data" x="40" y="545" width="150" height="50"/><text x="115" y="568" text-anchor="middle" class="t">Rain + forecast</text><text x="115" y="584" text-anchor="middle" class="s">ERA5 history, 7 days</text>
  <rect class="eng" x="240" y="545" width="170" height="50"/><text x="325" y="565" text-anchor="middle" class="t">Soil water balance</text><text x="325" y="582" text-anchor="middle" class="s">crop, soil, root zone</text>
  <rect class="eng" x="460" y="545" width="170" height="50"/><text x="545" y="565" text-anchor="middle" class="t">Irrigation schedule</text><text x="545" y="582" text-anchor="middle" class="s">when and how much</text>
  <rect class="box" x="680" y="545" width="170" height="50"/><text x="765" y="565" text-anchor="middle" class="t">Pump hours</text><text x="765" y="582" text-anchor="middle" class="s">inside feeder / sun window</text>
  <rect class="box" x="900" y="545" width="150" height="50"/><text x="975" y="565" text-anchor="middle" class="t">Field</text><text x="975" y="582" text-anchor="middle" class="s">drip or flood</text>
  <rect class="data" x="1080" y="545" width="120" height="50"/><text x="1140" y="565" text-anchor="middle" class="t">kWh, CO2, m3</text><text x="1140" y="582" text-anchor="middle" class="s">reported</text>
  <path class="e" d="M190 570 L238 570"/><path class="e" d="M410 570 L458 570"/><path class="e" d="M630 570 L678 570"/><path class="e" d="M850 570 L898 570"/><path class="e" d="M1050 570 L1078 570"/>

  <text x="40" y="632" class="h">Money (dashed): the farmer's plan becomes a priced forward offer</text>
  <rect class="box" x="40" y="647" width="170" height="50"/><text x="125" y="667" text-anchor="middle" class="t">Plan: crop, acres</text><text x="125" y="684" text-anchor="middle" class="s">usual / bad-year Rs</text>
  <rect class="box" x="270" y="647" width="190" height="50"/><text x="365" y="667" text-anchor="middle" class="t">Planting registry</text><text x="365" y="684" text-anchor="middle" class="s">totals only, never names</text>
  <rect class="box" x="520" y="647" width="190" height="50"/><text x="615" y="667" text-anchor="middle" class="t">Vendor priced need</text><text x="615" y="684" text-anchor="middle" class="s">price, grade, window, pickup</text>
  <rect class="box" x="770" y="647" width="190" height="50"/><text x="865" y="667" text-anchor="middle" class="t">Farmer commitment</text><text x="865" y="684" text-anchor="middle" class="s">reference code, 2-step confirm</text>
  <rect class="ext" x="1010" y="647" width="190" height="50"/><text x="1105" y="667" text-anchor="middle" class="t">UPI payment + delivery</text><text x="1105" y="684" text-anchor="middle" class="s">outside the app in v1</text>
  <path class="m" d="M210 672 L268 672"/><path class="m" d="M460 672 L518 672"/><path class="m" d="M710 672 L768 672"/><path class="m" d="M960 672 L1008 672"/>
  <text x="40" y="735" class="s">Subsidy path for solar pumps (PM-KUSUM B: 30% central + 30% state, farmer 40%) is an input to the payback calculator, not a transfer made by the app.</text>
  <text x="40" y="755" class="s">Optional later: soil-moisture sensor and relay on the pump, feeding the same schedule. Designed in docs/design_artifacts.md, not built.</text>
</svg>
